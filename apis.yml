name: SenSage
description: >-
  SenSage was a security information and event management (SIEM) and log/event
  analytics company backed by Battery Ventures and Canaan Partners. Its platform
  focused on collecting, warehousing, and analyzing very large volumes of security
  event and log data for threat detection, forensics, and regulatory compliance
  reporting. SenSage was later acquired by KEYW Holding Corporation and the brand
  was retired; its former domain, sensage.com, now redirects to IgniteTech (an ESW
  Capital software-acquisition operator). This profile was surfaced as a venture
  portfolio company and added to the API Evangelist network as a lead. No active
  developer portal, public API, or documentation surface was found during
  enrichment; the company is treated as defunct with no live API footprint.
